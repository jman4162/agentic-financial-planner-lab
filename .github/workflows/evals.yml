name: evals

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated golden case names, or "all" for the full set'
        required: false
        default: ""
      model:
        description: "Ollama model id to evaluate (defaults to the nightly model)"
        required: false
        default: ""
      critic_model:
        description: "Ollama model id for the LLM critic (defaults to qwen3)"
        required: false
        default: ""

env:
  # A dispatch can override the models for one-off experiments without editing this
  # file; the nightly schedule always uses the defaults.
  EVAL_MODEL: ${{ github.event.inputs.model || 'qwen2.5:3b' }}
  # The critic runs on a stronger model than the writer. A small model judging its
  # own prose proved erratic (it flagged a required memo section as securities
  # advice); the critic call is one short judgment per pass, so a larger judge fits
  # the budget even though a larger writer does not.
  EVAL_CRITIC_MODEL: ${{ github.event.inputs.critic_model || 'qwen3' }}
  # Hosted runners are CPU-only, and the full ten-case set costs more runner time than
  # is worth spending nightly. These four exercise distinct paths: a funded baseline, a
  # shortfall, guaranteed income near retirement, and a sparse case file. Dispatch the
  # workflow with cases=all for the whole set.
  NIGHTLY_CASES: on-track-couple,deficit-household,near-retiree,minimal-edge
  # This job is a smoke test, not a quality measurement, and the threshold is zero
  # on purpose.
  #
  # The model small enough to run here approves nothing: qwen2.5:3b scored 0/4,
  # failing numbers_traceable on every case, while the committed baseline in
  # evals/reports/latest.md scored 7/10 on qwen3. So the approval rate this job
  # reports says almost nothing about memo quality, and gating on it would only
  # encode the small model's ceiling.
  #
  # What a green run does prove: the pipeline executes end to end against a real
  # model, and no memo claimed a figure that the ledger cannot account for.
  # Deterministic ledger breaches fail the run regardless of this setting, as does a
  # case that crashed or ran out of time. Raise the threshold only alongside a model
  # that can clear it.
  EVAL_MIN_APPROVAL: "0"

jobs:
  # One case per job. Cases were run in a single step until the qwen3 critic tripled
  # per-case cost on a CPU runner, at which point four cases stopped fitting in any
  # step budget worth setting: the step was killed mid-run every night, taking the
  # report with it, and the cases at the end of the alphabet were never evaluated at
  # all. Sharding pays for that with runner minutes, which this repo has, instead of
  # with coverage.
  select-cases:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.pick.outputs.cases }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          CASES_INPUT: ${{ github.event.inputs.cases }}
        run: |
          if [ "$CASES_INPUT" = "all" ]; then
            names=$(basename -s .yaml evals/golden/*.yaml)
          elif [ -n "$CASES_INPUT" ]; then
            names=$(echo "$CASES_INPUT" | tr ',' ' ')
          else
            names=$(echo "$NIGHTLY_CASES" | tr ',' ' ')
          fi
          echo "selected: $names"
          # shellcheck disable=SC2086
          echo "cases=$(printf '%s\n' $names | jq -Rsc 'split("\n") | map(select(. != ""))')" \
            >> "$GITHUB_OUTPUT"

  golden-evals:
    needs: select-cases
    runs-on: ubuntu-latest
    # Sized from what this runner has shown: a memo draft off the small writer costs
    # 760 seconds and up, a judgment a few hundred more, and a case the critic rejects
    # pays for two of each. minimal-edge reached its judgment in 2132 seconds. LLM calls
    # stop at 60 minutes, the step at 70, the job at 85. The innermost limit is the one
    # that fires, so a stuck case ends as a reported failure with a report attached
    # rather than as a killed step.
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.select-cases.outputs.cases) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras

      - name: Install Ollama
        timeout-minutes: 5
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer registers a systemd service that runs as the `ollama` user and
          # stores models under /usr/share/ollama. That is not the path cached below, and
          # it also holds port 11434, so starting our own server failed with "address
          # already in use" on every run. Stop it and run the server as the runner user.
          sudo systemctl stop ollama

      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.EVAL_MODEL }}-${{ env.EVAL_CRITIC_MODEL }}

      - name: Start Ollama and pull models
        timeout-minutes: 20
        run: |
          ollama serve &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull "$EVAL_MODEL"
          if [ "$EVAL_CRITIC_MODEL" != "$EVAL_MODEL" ]; then
            ollama pull "$EVAL_CRITIC_MODEL"
          fi

      # Saved here rather than in a post step, so a slow or failing eval run cannot cost
      # the cache. The previous layout only saved on success, and since the job never
      # succeeded the model was re-pulled every night. Shards race for the same key on a
      # cold cache; the losers report a collision and are not a run failure.
      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.EVAL_MODEL }}-${{ env.EVAL_CRITIC_MODEL }}

      - name: Run golden eval
        timeout-minutes: 70
        env:
          OLLAMA_MODEL: ${{ env.EVAL_MODEL }}
          PLANNER_LAB_CRITIC_MODEL: ${{ env.EVAL_CRITIC_MODEL }}
          # qwen3 reasons before it answers, and on a CPU runner that reasoning is most
          # of the critic's wall clock: minutes of hidden tokens for a judgment that is
          # two booleans and a sentence. Off here only. The committed quality baseline
          # is a local run, which does not read this variable and is unaffected.
          PLANNER_LAB_CRITIC_THINK: "off"
          # Deterministic sampling, so a score change between nights means the code
          # changed rather than the dice. The local experiments pinned the same values.
          PLANNER_LAB_LLM_SEED: "42"
          PLANNER_LAB_LLM_TEMPERATURE: "0"
          # Per-call ceiling, for breaking a call that has stopped making progress.
          # It has to clear the slowest healthy call by a margin or it just fails good
          # work: at 900s it sat on top of the writer's own cost, and deficit-household
          # spent 1807 seconds timing out twice on a call that needed more than either
          # attempt was given.
          PLANNER_LAB_LLM_TIMEOUT: "1500"
          # Per-case ceiling, shared by every call the case makes, retries included.
          # Without it a case makes up to four calls of PLANNER_LAB_LLM_TIMEOUT, twice
          # each, and can outlast any step budget on its own. This is the limit meant to
          # bound a case; the per-call one above only breaks a single stuck request.
          EVAL_CASE_BUDGET: "3600"
        run: |
          uv run python evals/run_evals.py \
            --cases "${{ matrix.case }}" \
            --out "evals/reports/ci-${{ matrix.case }}.md"

      - name: Publish report to job summary
        if: always()
        run: cat "evals/reports/ci-${{ matrix.case }}.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.case }}
          path: evals/reports/ci-${{ matrix.case }}.md

  report:
    needs: golden-evals
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-report-*
          merge-multiple: true
          path: reports
      - name: Publish the combined report
        run: |
          {
            echo "> **The approval rate below is not a quality measurement.** This job runs"
            echo "> \`$EVAL_MODEL\`, which is small enough to finish on a CPU-only runner and"
            echo "> approves close to nothing. A green run means the pipeline executed end to"
            echo "> end against a real model and every recorded calculator output matched the"
            echo "> golden expectations, including on rejected memos. For a quality number,"
            echo "> see the committed baseline in \`evals/reports/latest.md\`. Rejections carry"
            echo "> their evidence in the report below."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if ls reports/*.md >/dev/null 2>&1; then
            cat reports/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No case produced a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('reports/*.md') != ''
        with:
          name: eval-report
          path: reports
